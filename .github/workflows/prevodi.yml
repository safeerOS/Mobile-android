name: Preverbe

# Prve samodejne preverbe za ta repozitorij. Tecejo brez Android SDK, zato so
# gotove v nekaj sekundah in nic ne stanejo.
#
#  1. prevodi  -- jezik, ki zaostaja za privzetim, bi uporabniku pokazal prazno
#                 polje ali slovenscino. To smo doslej iskali rocno.
#
# Tedenski pregled 25. 11. 2026 (N1): preverbe zaznavalnika sivega plakata tu ni
# vec (ta tek ima samo korak prevodov); akcije so pripete na commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preverbe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Vsak jezik mora imeti vse kljuce
        run: python3 tools/preveri-prevode.py .

